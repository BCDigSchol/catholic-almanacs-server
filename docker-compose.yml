services:
  mysqldb-prod:
    image: mysql:5.7
    restart: unless-stopped
    platform: linux/x86_64
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=database
    ports:
      # host ports sit off the defaults (8080/3307) so this stack can run beside other local projects
      - 3317:3306
    volumes:
      - db-prod:/var/lib/mysql
    networks:
      - server-network

  mysqldb-dev:
    image: mysql:5.7
    restart: unless-stopped
    platform: linux/x86_64
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=database
    ports:
      - 3318:3306
    volumes:
      - db-dev:/var/lib/mysql
    networks:
      - server-network

  nodejs-prod:
    depends_on:
      - mysqldb-prod
    build: server/
    restart: unless-stopped
    ports:
      - 8090:8080
    environment:
      - DB_HOST=mysqldb-prod
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=database
      - DB_LOCAL_PORT=3317
      - DB_PORT=3306
      - WEB_PORT=8080
      - JWT_SECRET=secret
      - OWNER_USERNAME=catholic-almanacs-owner
      - OWNER_PASSWORD=123456
      - OWNER_EMAIL=sample@email.com
    stdin_open: true
    tty: true
    networks:
      - server-network
    volumes:
      # the tile build's railroad distances (stats/railroads), read-only
      - tiles-data:/tiles-data:ro

  nodejs-dev:
    depends_on:
      - mysqldb-dev
    build: server/
    restart: unless-stopped
    ports:
      # container listens on WEB_PORT=8081, so the container-side port must be 8081
      - 8091:8081
    environment:
      - DB_HOST=mysqldb-dev
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=database
      - DB_LOCAL_PORT=3318
      - DB_PORT=3306
      - WEB_PORT=8081
      - JWT_SECRET=secret
      - OWNER_USERNAME=catholic-almanacs-owner
      - OWNER_PASSWORD=password
      - OWNER_EMAIL=sample@email.com
    stdin_open: true
    tty: true
    networks:
      - server-network
    volumes:
      # the tile build's railroad distances (stats/railroads), read-only
      - tiles-data:/tiles-data:ro

  # Map tiles (see tiles/README.md). tiles-build is a one-off job that builds
  # the tiles into the tiles-data volume:
  #   docker compose run --rm tiles-build [base|detail]
  # The street detail follows the places recorded in mysqldb-prod.
  tiles-build:
    build:
      context: tiles/
      target: builder
    profiles: ["build"]
    depends_on:
      - mysqldb-prod
    environment:
      - DB_HOST=mysqldb-prod
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=database
    volumes:
      - tiles-data:/data
      - tiles-work:/work
    networks:
      - server-network

  tiles:
    build:
      context: tiles/
      target: server
    restart: unless-stopped
    ports:
      - 8092:3000
    environment:
      - TILES_PUBLIC_URL=http://localhost:8092
    volumes:
      - tiles-data:/data:ro

volumes:
  db-prod:
  db-dev:
  tiles-data:
  # the builder's downloads, kept between builds
  tiles-work:

networks:
  server-network: