<div class="page">
    <app-page-header
        title="Dashboards"
        subtitle="Maps, networks and charts drawn from every almanac year. Start with the overview, or pick a question below.">
    </app-page-header>

    @for (group of groups; track group.title) {
        <section class="group" [attr.aria-labelledby]="'group-' + $index">
            <h2 [id]="'group-' + $index">{{ group.title }}</h2>
            <p class="group-subtitle">{{ group.subtitle }}</p>
            <ul class="cards">
                @for (card of group.cards; track card.link) {
                    <li class="card">
                        <mat-icon class="icon" aria-hidden="true">{{ card.icon }}</mat-icon>
                        <h3><a [routerLink]="card.link">{{ card.title }}</a></h3>
                        <p>{{ card.description }}</p>
                    </li>
                }
            </ul>
        </section>
    }
</div>
